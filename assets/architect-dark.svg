<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Solution architecture at the center, connected to cloud engineering, AWS, DevOps, AI/ML, backend and databases">
  <style>
    .s{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{animation:flow 1.2s linear infinite}
    .halo{animation:halo 3s ease-in-out infinite;transform-origin:640px 280px}
    @keyframes flow{to{stroke-dashoffset:-18}}
    @keyframes halo{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.45;transform:scale(1.035)}}
    @media (prefers-reduced-motion:reduce){.flow,.halo{animation:none}.pkt{display:none}}
  </style>
  <rect width="1280" height="560" fill="#13110f"/>
  <defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#332d28"/></pattern></defs>
  <rect width="1280" height="560" fill="url(#g)" opacity=".7"/>
  <path d="M450 250 H427 Q415 250 415 238 V122 Q415 110 403 110 H380" fill="none" stroke="#332d28" stroke-width="2"/>
