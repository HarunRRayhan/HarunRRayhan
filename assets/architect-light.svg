<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Solution architecture at the center, connected to cloud engineering, AWS, DevOps, AI/ML, backend and databases">
  <style>
