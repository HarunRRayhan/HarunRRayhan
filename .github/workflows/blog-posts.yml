name: Latest blog posts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://harun.dev/blog/feed.xml"
          max_post_count: 5
          template: "- [$title]($url)$newline"
          commit_message: "Update latest blog posts"
